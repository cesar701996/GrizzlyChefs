name: Publish to GitHub Pages

# Every push to main builds the site and publishes dist/ to the gh-pages
# branch, which GitHub Pages serves at cesar701996.github.io/GrizzlyChefs/.
# Pushes to motion-preview publish to .../GrizzlyChefs/preview/ instead, so a
# new version can be tried without touching the main demo.
on:
  push:
    branches: [main, motion-preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_name == 'main' && '' || 'preview' }}
          keep_files: ${{ github.ref_name != 'main' }}
